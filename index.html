<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7ed">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <title>WebFile Explorer</title>
  <script>
    (() => {
      try {
        const savedTheme=localStorage.getItem("webfile-theme");
        const savedLanguage=localStorage.getItem("webfile-language");
        const theme=savedTheme==="dark"||savedTheme==="light"?savedTheme:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
        const lang=savedLanguage==="zh"||savedLanguage==="en"?savedLanguage:(navigator.language.toLowerCase().startsWith("zh")?"zh":"en");
        document.documentElement.dataset.theme=theme;
        document.documentElement.dataset.language=lang;
        document.documentElement.lang=lang==="zh"?"zh-CN":"en";
      } catch {
        document.documentElement.dataset.theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
        const lang=navigator.language.toLowerCase().startsWith("zh")?"zh":"en";
        document.documentElement.dataset.language=lang;
        document.documentElement.lang=lang==="zh"?"zh-CN":"en";
      }
    })();
  </script>
  <style>
    :root {
      color-scheme:light;
      --bg:#f7f6f1;
      --panel:#fff;
      --soft:#f1eee4;
      --text:#29271f;
      --muted:#777467;
      --line:#e9e5d8;
      --accent:#bd8c13;
      --accent-soft:#fff4d2;
      --shadow:0 14px 36px rgba(29,35,54,.08);
      --shadow-card:0 2px 6px rgba(29,35,54,.03),0 12px 30px rgba(29,35,54,.04);
    }
    [data-theme="dark"] {
      color-scheme:dark;
      --bg:#15140f;
      --panel:#1d1b15;
      --soft:#29271f;
      --text:#f3efe3;
      --muted:#aaa694;
      --line:#353225;
      --accent:#efc24e;
      --accent-soft:#3c321b;
      --shadow:0 18px 44px rgba(0,0,0,.3);
      --shadow-card:0 2px 6px rgba(0,0,0,.12),0 14px 30px rgba(0,0,0,.16);
    }
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;height:100vh;overflow:hidden;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg);transition:background .22s ease,color .22s ease}
    button,input{font:inherit}
    button{color:inherit}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .app{height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr);perspective:1200px}
    .app.details-open{grid-template-columns:220px minmax(0,1fr) var(--details-width,300px)}
    .sidebar{position:relative;display:flex;flex-direction:column;padding:18px 12px 12px;border-right:1px solid var(--line);background:var(--panel);box-shadow:4px 0 24px rgba(24,30,46,.025)}
    .brand{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px;font-weight:750;letter-spacing:-.02em}
    .brand-name{flex:1}
    .sidebar-toggle{width:30px;height:30px;flex:none}
    .sidebar-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;transition:transform .18s ease}
    .sidebar-collapsed .sidebar-toggle svg{transform:rotate(180deg)}
    .brand-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#eac451,#bd8c13);color:#fff;box-shadow:0 6px 16px rgba(189,140,19,.22);transition:transform .22s ease,box-shadow .22s ease}
    .brand:hover .brand-icon{transform:translateY(-1px) rotate(-3deg);box-shadow:0 9px 22px rgba(189,140,19,.32)}
    .brand-icon svg{width:20px;height:20px}
    .nav{display:flex;flex-direction:column;gap:4px;margin-top:18px}
    .nav-label{margin:22px 10px 8px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
    .nav button{height:40px;border:0;border-radius:9px;display:flex;align-items:center;gap:10px;padding:0 10px;background:none;color:var(--muted);cursor:pointer;text-align:left;font-size:13px;transition:background .16s ease,color .16s ease,transform .16s ease}
    .nav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
    .nav button:hover{background:var(--soft);color:var(--text)}
    .nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
    .nav button.active::before{content:"";width:3px;height:18px;margin-left:-10px;margin-right:7px;border-radius:0 3px 3px 0;background:var(--accent)}
    .folder-tree{display:flex;flex-direction:column;gap:2px;margin-top:2px}
    .tree-node{min-width:0}
    .tree-line{height:34px;display:flex;align-items:center;gap:2px;padding-right:6px;border-radius:8px}
    .tree-line:hover{background:var(--soft)}
    .tree-line.selected{background:var(--accent-soft);color:var(--accent)}
    .tree-expander{width:28px;height:28px;flex:none;border:0;border-radius:6px;display:grid;place-items:center;background:none;color:var(--muted);cursor:pointer}
    .tree-expander:hover{background:var(--line)}
    .tree-expander svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .16s}
    .tree-node.expanded>.tree-line .tree-expander svg{transform:rotate(90deg)}
    .tree-expander.spacer{cursor:default}
    .tree-folder{min-width:0;flex:1;height:32px;border:0;padding:0 4px;display:flex;align-items:center;gap:8px;background:none;color:inherit;cursor:pointer;text-align:left;font-size:13px}
    .tree-folder svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8}
    .tree-folder span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tree-children{display:none;margin-left:14px;padding-left:9px;border-left:1px solid var(--line)}
    .tree-node.expanded>.tree-children{display:block}
    .sidebar-scrim{display:none}
    body.booting .sidebar{animation:structureFromLeft .82s cubic-bezier(.18,.78,.22,1) both}
    body.booting .topbar{animation:structureFromTop .76s cubic-bezier(.18,.78,.22,1) 60ms both}
    body.booting .content{animation:structureFromFront .9s cubic-bezier(.18,.78,.22,1) 110ms both}
    body.booting .details-panel{animation:structureFromRight .84s cubic-bezier(.18,.78,.22,1) 140ms both}
    body.booting .card{animation-duration:.68s}
    body.booting .card:nth-child(2){animation-delay:170ms}
    body.booting .card:nth-child(3){animation-delay:220ms}
    body.booting .card:nth-child(4){animation-delay:270ms}
    body.booting .card:nth-child(5){animation-delay:320ms}
    body.booting .card:nth-child(6){animation-delay:370ms}
    .startup-screen{position:fixed;z-index:200;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,var(--accent-soft),transparent 44%),var(--bg);opacity:1;visibility:visible;transition:opacity .38s cubic-bezier(.2,.8,.2,1),visibility .38s ease}
    .startup-screen.leaving{opacity:0;visibility:hidden;pointer-events:none}
    .startup-screen::before,.startup-screen::after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;filter:blur(75px);pointer-events:none}
    .startup-screen::before{left:calc(50% - 350px);top:calc(50% - 250px);background:rgba(235,195,73,.2);animation:ambientDrift 5s ease-in-out infinite alternate}
    .startup-screen::after{right:calc(50% - 390px);bottom:calc(50% - 290px);background:rgba(189,140,19,.13);animation:ambientDrift 6s ease-in-out -2s infinite alternate-reverse}
    .startup-content{position:relative;z-index:1;width:min(300px,80vw);display:flex;flex-direction:column;align-items:center;animation:startupReveal .7s cubic-bezier(.2,.8,.2,1) both}
    .startup-mark{position:relative;width:82px;height:82px;margin-bottom:20px;border-radius:25px;box-shadow:0 16px 38px rgba(189,140,19,.26),0 0 0 1px rgba(255,255,255,.62) inset;animation:startupMark .8s cubic-bezier(.2,.8,.2,1) both,markFloat 3.2s ease-in-out .8s infinite}
    .startup-mark::before{content:"";position:absolute;inset:-10px;border:1px solid rgba(189,140,19,.2);border-radius:30px;animation:orbitPulse 2.4s ease-out infinite}
    .startup-mark::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(112deg,transparent 25%,rgba(255,255,255,.5) 48%,transparent 68%);transform:translateX(-130%);animation:markShine 1.2s ease .42s both}
    .startup-mark img{display:block;width:100%;height:100%;border-radius:inherit}
    .startup-orbit{position:absolute;z-index:2;width:6px;height:6px;border-radius:50%;background:#efc24e;box-shadow:0 0 12px rgba(239,194,78,.75)}
    .startup-orbit.one{left:50%;top:50%;animation:orbitOne 2.8s linear infinite}
    .startup-orbit.two{left:50%;top:50%;width:4px;height:4px;animation:orbitTwo 3.6s linear infinite}
    .startup-orbit.three{left:50%;top:50%;width:4px;height:4px;animation:orbitThree 3.2s linear infinite}
    .startup-name{font-size:21px;font-weight:780;letter-spacing:-.045em;animation:textGlow 2.8s ease-in-out infinite}
    .startup-caption{margin-top:6px;color:var(--muted);font-size:12px;letter-spacing:.02em}
    .startup-track{position:relative;width:136px;height:3px;margin-top:24px;border-radius:99px;background:var(--line);overflow:hidden}
    .startup-track span{position:absolute;left:0;top:0;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#d9a51e,#f4d36a,#b9820d);box-shadow:0 0 12px rgba(189,140,19,.45);animation:startupProgress .7s cubic-bezier(.4,0,.2,1) both}
    @keyframes structureFromLeft{0%{opacity:0;transform:translate3d(-72px,0,-36px) rotateY(-7deg)}100%{opacity:1;transform:translate3d(0,0,0) rotateY(0)}}
    @keyframes structureFromTop{0%{opacity:0;transform:translate3d(0,-48px,-24px)}100%{opacity:1;transform:translate3d(0,0,0)}}
    @keyframes structureFromFront{0%{opacity:0;transform:translate3d(0,48px,-50px) scale(.975)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
    @keyframes structureFromRight{0%{opacity:0;transform:translate3d(72px,0,-30px) rotateY(7deg)}100%{opacity:1;transform:translate3d(0,0,0) rotateY(0)}}
    @keyframes startupReveal{from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
    @keyframes startupMark{0%{opacity:0;transform:scale(.72) rotate(-9deg)}72%{opacity:1;transform:scale(1.07) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes startupProgress{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
    @keyframes markShine{to{transform:translateX(130%)}}
    @keyframes markFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes orbitPulse{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.2);opacity:0}}
    @keyframes ambientDrift{from{transform:translate3d(-18px,-12px,0) scale(.9)}to{transform:translate3d(22px,18px,0) scale(1.1)}}
    @keyframes orbitOne{from{transform:translate(-50%,-50%) rotate(0) translateX(52px)}to{transform:translate(-50%,-50%) rotate(360deg) translateX(52px)}}
    @keyframes orbitTwo{from{transform:translate(-50%,-50%) rotate(0) translateX(58px)}to{transform:translate(-50%,-50%) rotate(-360deg) translateX(58px)}}
    @keyframes orbitThree{from{transform:translate(-50%,-50%) rotate(0) translateX(44px)}to{transform:translate(-50%,-50%) rotate(360deg) translateX(44px)}}
    @keyframes textGlow{0%,100%{text-shadow:0 0 0 rgba(189,140,19,0)}50%{text-shadow:0 0 18px rgba(189,140,19,.2)}}
    .sidebar-collapsed .app{grid-template-columns:64px minmax(0,1fr)}
    .sidebar-collapsed .app.details-open{grid-template-columns:64px minmax(0,1fr) var(--details-width,300px)}
    .sidebar-collapsed .brand{gap:0;padding:0;justify-content:center}
    .sidebar-collapsed .brand-name,.sidebar-collapsed .nav-label,.sidebar-collapsed #allFilesButton .nav-text,.sidebar-collapsed .tree-folder span{display:none}
    .sidebar-collapsed .nav button{justify-content:center;padding:0}
    .sidebar-collapsed .tree-children{margin-left:0;padding-left:0;border-left:0}
    .sidebar-collapsed .tree-line{justify-content:center;padding:0}
    .sidebar-collapsed .tree-expander{display:none}
    .sidebar-collapsed .tree-folder{justify-content:center;padding:0}
    .sidebar-footer{margin-top:auto;min-height:44px;display:flex;align-items:center;gap:8px;padding:10px 9px 0;border-top:1px solid var(--line);color:var(--muted);font-size:10.5px}
    .status-dot{width:7px;height:7px;flex:none;border-radius:50%;background:#38a979;box-shadow:0 0 0 3px rgba(56,169,121,.12)}
    .footer-label{flex:1}
    .version{font-variant-numeric:tabular-nums;color:var(--muted);font-size:10px}
    .sidebar-collapsed .sidebar-footer{justify-content:center;padding-right:0;padding-left:0}
    .sidebar-collapsed .footer-label{display:none}
    .sidebar-collapsed .version{font-size:8px}
    .main{min-width:0;display:flex;flex-direction:column}
    .details-panel{display:none;width:100%;min-width:240px;max-width:520px;border-left:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden}
    .app.details-open .details-panel{display:flex;flex-direction:column}
    .details-resizer{position:absolute;z-index:5;left:-4px;top:0;width:8px;height:100%;cursor:col-resize}
    .details-resizer::after{content:"";position:absolute;left:3px;top:0;width:1px;height:100%;background:transparent;transition:background .15s}
    .details-resizer:hover::after,.details-resizer.dragging::after{background:var(--accent)}
    .details-header{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}
    .details-header h2{margin:0;font-size:14px}
    .details-body{padding:18px;overflow-x:hidden;overflow-y:auto}
    .details-preview{height:150px;display:grid;place-items:center;margin-bottom:16px;border-radius:12px;background:var(--soft)}
    .details-preview .file-icon{width:72px;height:72px}
    .details-name{margin:0 0 14px;font-size:15px;font-weight:750;word-break:break-word}
    .detail-row{display:grid;grid-template-columns:68px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
    .detail-row span:first-child{color:var(--muted)}
    .detail-row span:last-child{min-width:0;text-align:right;overflow-wrap:anywhere;word-break:break-word;line-height:1.45}
    .detail-tree{margin-top:18px;border-top:1px solid var(--line)}
    .tree-group{border-bottom:1px solid var(--line)}
    .tree-toggle{width:100%;height:42px;border:0;padding:0 4px;display:flex;align-items:center;gap:8px;background:none;color:var(--text);cursor:pointer;text-align:left;font-size:12.5px;font-weight:700}
    .tree-toggle:hover{background:var(--soft)}
    .tree-arrow{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--muted);transition:transform .18s ease}
    .tree-arrow svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tree-group.open>.tree-toggle .tree-arrow{transform:rotate(90deg)}
    .tree-content{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .22s ease,opacity .16s ease}
    .tree-group.open>.tree-content{grid-template-rows:1fr;opacity:1}
    .tree-content-inner{min-height:0;overflow:hidden}
    .tree-row{min-height:36px;display:grid;grid-template-columns:68px minmax(0,1fr);align-items:start;gap:10px;padding:8px 4px 8px 24px;font-size:12px}
    .tree-row-label{color:var(--muted)}
    .tree-row-value{min-width:0;text-align:left;overflow-wrap:anywhere;word-break:break-word;line-height:1.45}
    .breadcrumb{height:24px;margin-bottom:8px;display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
    .breadcrumb button{border:0;border-radius:6px;padding:4px 6px;background:none;color:inherit;cursor:pointer}
    .breadcrumb button:hover{background:var(--soft);color:var(--text)}
    .breadcrumb span{color:var(--muted)}
    .topbar{height:72px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px)}
    .search{position:relative;width:min(520px,55vw)}
    .search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.8}
    .search input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 40px;outline:none;background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(20,25,40,.025);transition:border-color .16s,box-shadow .16s}
    .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .top-actions{margin-left:auto;display:flex;gap:6px}
    .icon-button{width:36px;height:36px;border:0;border-radius:9px;display:grid;place-items:center;background:none;color:var(--muted);cursor:pointer;transition:background .16s,color .16s}
    .icon-button:hover{background:var(--soft);color:var(--text)}
    .icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
    .content{flex:1;overflow:auto;padding:18px 24px 36px;background:radial-gradient(ellipse at 88% 0%,color-mix(in srgb,var(--accent-soft) 46%,transparent),transparent 40%),var(--bg)}
    .heading{height:76px;display:flex;align-items:center;justify-content:space-between}
    .heading h1{margin:0;font-size:26px;font-weight:730;letter-spacing:-.6px}
    .heading p{margin:6px 0 0;color:var(--muted);font-size:12px}
    .view-switch{height:36px;display:flex;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
    .view-switch button{width:30px;height:28px;border:0;border-radius:7px;display:grid;place-items:center;background:none;cursor:pointer}
    .view-switch button.active{background:var(--soft);color:var(--accent)}
    .view-switch svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
    .card{position:relative;height:190px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel);cursor:pointer;box-shadow:0 1px 2px rgba(24,30,46,.025);animation:cardArrive .46s cubic-bezier(.2,.8,.2,1) both;transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s,border-color .24s}
    .card:nth-child(2){animation-delay:35ms}.card:nth-child(3){animation-delay:70ms}.card:nth-child(4){animation-delay:105ms}.card:nth-child(5){animation-delay:140ms}.card:nth-child(6){animation-delay:175ms}
    .card:hover{transform:translateY(-5px) scale(1.012);box-shadow:var(--shadow-card);border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
    .card:hover .file-icon{transform:scale(1.055) rotate(-2deg)}
    .card[draggable="true"]{cursor:grab}
    .card[draggable="true"]:active{cursor:grabbing}
    .card.dragging{opacity:.42;transform:scale(.97)}
    .card.drop-target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-card)}
    .card.drop-target-before::before,.card.drop-target-after::after{content:"";position:absolute;z-index:4;border-radius:4px;background:var(--accent);box-shadow:0 0 12px rgba(189,140,19,.45);pointer-events:none}
    .grid .card.drop-target-before::before{left:1px;top:14px;bottom:14px;width:3px}
    .grid .card.drop-target-after::after{right:1px;top:14px;bottom:14px;width:3px}
    .list .card.drop-target-before::before{left:8px;right:8px;top:0;height:3px}
    .list .card.drop-target-after::after{left:8px;right:8px;bottom:0;height:3px}
    .card.just-moved{animation:itemReposition .48s cubic-bezier(.2,.8,.2,1) both}
    .drag-handle{position:absolute;z-index:2;right:10px;top:10px;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);opacity:0;transform:translateY(-3px);transition:opacity .16s,transform .16s}
    .card:hover .drag-handle{opacity:.86;transform:translateY(0)}
    .drag-handle svg{width:15px;height:15px;fill:currentColor}
    .preview{height:126px;display:grid;place-items:center;background:linear-gradient(145deg,var(--soft),var(--panel))}
    .file-icon{width:62px;height:62px;display:grid;place-items:center;border-radius:16px;background:var(--icon-bg);color:var(--icon-ink);transition:transform .18s ease,background .18s ease}
    .file-icon svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .file-icon-folder{--icon-ink:#9b6c06;--icon-bg:#fff0bd}
    .file-icon-html{--icon-ink:#aa7300;--icon-bg:#fff1cc}
    .file-icon-document{--icon-ink:#5573a8;--icon-bg:#e9f0ff}
    .file-icon-image{--icon-ink:#4e8a68;--icon-bg:#e5f4e9}
    .file-icon-video{--icon-ink:#b25e54;--icon-bg:#ffebe7}
    .file-icon-audio{--icon-ink:#8061a8;--icon-bg:#f1e9fa}
    .file-icon-archive{--icon-ink:#7b6c49;--icon-bg:#f3eedf}
    .file-icon-code{--icon-ink:#397f87;--icon-bg:#e2f4f3}
    .file-icon-other{--icon-ink:#6d7585;--icon-bg:#edf0f4}
    [data-theme="dark"] .file-icon-folder{--icon-ink:#f2c34d;--icon-bg:#3d321a}
    [data-theme="dark"] .file-icon-html{--icon-ink:#efbc42;--icon-bg:#3b301b}
    [data-theme="dark"] .file-icon-document{--icon-ink:#9eb8ef;--icon-bg:#252f43}
    [data-theme="dark"] .file-icon-image{--icon-ink:#94d4a9;--icon-bg:#20372a}
    [data-theme="dark"] .file-icon-video{--icon-ink:#f0a197;--icon-bg:#422724}
    [data-theme="dark"] .file-icon-audio{--icon-ink:#c6a5ed;--icon-bg:#342943}
    [data-theme="dark"] .file-icon-archive{--icon-ink:#d1c298;--icon-bg:#373326}
    [data-theme="dark"] .file-icon-code{--icon-ink:#8bd1d2;--icon-bg:#20383a}
    [data-theme="dark"] .file-icon-other{--icon-ink:#b2b9c7;--icon-bg:#292e39}
    .tree-icon{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--icon-ink)}
    .tree-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .card-info{height:64px;display:flex;align-items:center;gap:9px;padding:10px 12px}
    .file-dot{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--icon-bg);color:var(--icon-ink)}
    .file-dot svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .card-text{min-width:0}
    .card-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}
    .card-meta{display:block;margin-top:4px;color:var(--muted);font-size:11px}
    .list{display:flex;flex-direction:column}
    .list .card{height:58px;display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0}
    .list .card:hover{transform:none;box-shadow:none;background:var(--panel)}
    .list .preview{grid-column:1;grid-row:1;width:64px;height:58px;background:none}
    .list .file-icon{width:38px;height:38px;border-radius:9px}
    .list .file-icon svg{width:20px;height:20px}
    .list .card-info{grid-column:2;grid-row:1;min-width:0;height:58px;margin-left:0}
    .list .file-dot{display:none}
    .empty{grid-column:1/-1;height:320px;display:grid;place-items:center;text-align:center;color:var(--muted)}
    .empty strong{display:block;margin-bottom:6px;color:var(--text)}
    .mobile-menu{display:none}
    .language-toggle{height:34px;min-width:38px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:11px;font-weight:750;cursor:pointer;transition:background .16s,border-color .16s,color .16s}
    .language-toggle:hover{border-color:var(--accent);color:var(--accent)}
    @keyframes cardArrive{from{opacity:0;transform:translateY(12px) scale(.985);filter:blur(3px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
    @keyframes itemReposition{0%{opacity:.45;transform:translateY(9px) scale(.95)}65%{opacity:1;transform:translateY(-3px) scale(1.015)}100%{opacity:1;transform:translateY(0) scale(1)}}
    .view-switch,.icon-button,.card,.sidebar{transition-property:background-color,border-color,color,box-shadow,transform,width}
    .app,.details-panel{transition:grid-template-columns .22s ease,background-color .2s ease}
    @media(max-width:768px){
      body{overflow:auto}
      body.booting .sidebar{animation:mobileRailSettle .82s cubic-bezier(.18,.78,.22,1) both}
      .app{grid-template-columns:1fr}
      .app.details-open{grid-template-columns:1fr}
      .details-panel{display:none!important}
      .details-resizer{display:none}
      .sidebar{position:fixed;z-index:20;left:0;top:0;width:220px;height:100vh;transform:translateX(-100%);box-shadow:var(--shadow);transition:transform .2s}
      .sidebar.open{transform:translateX(0)}
      .sidebar-scrim.open{display:block;position:fixed;z-index:19;inset:0;background:rgba(15,18,24,.32)}
      .sidebar-collapsed .app,.sidebar-collapsed .app.details-open{grid-template-columns:1fr}
      .topbar{height:64px;padding:0 14px}
      .mobile-menu{display:grid}
      .search{width:auto;flex:1}
      .content{padding:12px 14px 28px}
      .heading{height:76px}
      .heading h1{font-size:22px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .card{height:170px}
      .preview{height:106px}
    }
    @keyframes mobileRailSettle{0%{opacity:0;transform:translateX(-118%)}100%{opacity:1;transform:translateX(-100%)}}
  </style>
</head>
<body class="booting">
  <div class="startup-screen" id="startupScreen" role="status" aria-live="polite">
    <div class="startup-content">
      <div class="startup-mark" aria-hidden="true">
        <img src="./favicon.svg" alt="">
        <span class="startup-orbit one"></span>
        <span class="startup-orbit two"></span>
        <span class="startup-orbit three"></span>
      </div>
      <div class="startup-name">WebFile</div>
      <div class="startup-caption" data-i18n="startupCaption">正在整理你的文件空间</div>
      <div class="startup-track" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8a3 3 0 0 1 3-3h4l2 2h6a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path d="M17 2.5 18 5l2.5 1-2.5 1-1 2.5L16 7l-2.5-1L16 5z" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="brand-name">WebFile</span>
        <button class="icon-button sidebar-toggle" id="sidebarToggle" aria-label="收起侧边栏" title="收起侧边栏">
          <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>
        </button>
      </div>
      <nav class="nav" id="nav">
        <button class="active" id="allFilesButton">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
          <span class="nav-text" data-i18n="allFiles">所有文件</span>
        </button>
        <div class="nav-label" data-i18n="folders">文件夹</div>
        <div class="folder-tree" id="folderTree"></div>
      </nav>
      <footer class="sidebar-footer">
        <span class="status-dot"></span>
        <span class="footer-label" data-i18n="staticIndex">静态索引</span>
        <span class="version">v1.3.0</span>
      </footer>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" aria-label="打开菜单" data-i18n-aria="openMenu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/></svg>
          <input id="search" type="search" placeholder="搜索文件和文件夹…" aria-label="搜索文件" data-i18n-placeholder="search" data-i18n-aria="search">
        </div>
        <div class="top-actions">
          <button class="language-toggle" id="languageToggle" aria-label="切换语言" data-i18n-aria="switchLanguage">EN</button>
          <button class="icon-button" id="theme" aria-label="切换主题" data-i18n-aria="switchTheme">
            <svg viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"/></svg>
          </button>
        </div>
      </header>

      <section class="content">
        <nav class="breadcrumb" id="breadcrumb" aria-label="路径导航" data-i18n-aria="pathNavigation"></nav>
        <div class="heading">
          <div><h1 id="title">所有文件</h1><p id="count">0 个项目</p></div>
          <div class="view-switch" aria-label="切换视图" data-i18n-aria="viewSwitch">
            <button class="active" data-view="grid" aria-label="网格视图" data-i18n-aria="gridView"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
            <button data-view="list" aria-label="列表视图" data-i18n-aria="listView"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button>
          </div>
        </div>
        <div class="grid" id="files"></div>
      </section>
    </main>
    <aside class="details-panel" id="detailsPanel" aria-label="详细信息" data-i18n-aria="details">
      <div class="details-resizer" id="detailsResizer" title="拖动调整详细信息宽度" data-i18n-title="resizeDetails"></div>
      <header class="details-header">
        <h2 data-i18n="details">详细信息</h2>
        <button class="icon-button" id="closeDetails" aria-label="关闭详细信息" data-i18n-aria="closeDetails">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="details-body" id="detailsBody"></div>
    </aside>
  </div>

  <script src="files-manifest.js"></script>
  <script>
    const root = window.FILE_MANIFEST || {name:"所有文件",type:"folder",children:[]};
    const messages = {
      zh:{
        allFiles:"所有文件",folders:"文件夹",staticIndex:"静态索引",search:"搜索文件和文件夹…",
        startupCaption:"正在整理你的文件空间",
        openMenu:"打开菜单",switchLanguage:"切换语言",switchTheme:"切换主题",pathNavigation:"路径导航",
        viewSwitch:"切换视图",gridView:"网格视图",listView:"列表视图",details:"详细信息",
        closeDetails:"关闭详细信息",resizeDetails:"拖动调整详细信息宽度",
        collapseSidebar:"收起侧边栏",expandSidebar:"展开侧边栏",
        searchResults:"搜索结果",items:"个项目",noResultsTitle:"没有找到文件",
        noResultsBody:"请尝试其他搜索关键词",expand:"展开",collapse:"收起",basicInfo:"基本信息",
        properties:"属性",type:"类型",size:"大小",modified:"修改时间",location:"位置",
        readOnly:"只读",hidden:"隐藏",yes:"是",no:"否",folder:"文件夹",file:"文件",
        html:"HTML 网站",document:"文档",image:"图片",video:"视频",audio:"音频",
        archive:"压缩文件",code:"代码",other:"其他",
        dragToInsert:"拖到卡片前/后插入（仅当前浏览器）"
      },
      en:{
        allFiles:"All files",folders:"Folders",staticIndex:"Static index",search:"Search files and folders…",
        startupCaption:"Preparing your file workspace",
        openMenu:"Open menu",switchLanguage:"Switch language",switchTheme:"Switch theme",pathNavigation:"Path navigation",
        viewSwitch:"Change view",gridView:"Grid view",listView:"List view",details:"Details",
        closeDetails:"Close details",resizeDetails:"Drag to resize details pane",
        collapseSidebar:"Collapse sidebar",expandSidebar:"Expand sidebar",
        searchResults:"Search results",items:"items",noResultsTitle:"No files found",
        noResultsBody:"Try a different search term",expand:"Expand",collapse:"Collapse",basicInfo:"General",
        properties:"Properties",type:"Type",size:"Size",modified:"Modified",location:"Location",
        readOnly:"Read-only",hidden:"Hidden",yes:"Yes",no:"No",folder:"Folder",file:"File",
        html:"HTML website",document:"Document",image:"Image",video:"Video",audio:"Audio",
        archive:"Archive",code:"Code",other:"Other",
        dragToInsert:"Drop before/after a card to insert (this browser only)"
      }
    };
    const getPreference=key=>{try{return localStorage.getItem(key)}catch{return null}};
    const savePreference=(key,value)=>{try{localStorage.setItem(key,value)}catch{}};
    let language=document.documentElement.dataset.language||"zh";
    let selectedItem=null;
    let recentlyMovedPaths=new Set();
    let draggingPath=null;
    let dragInsertAfter=false;
    let ignoreCardClickUntil=0;

    function t(key){return messages[language][key]||messages.en[key]||key}

    function applyLanguage(){
      document.documentElement.dataset.language=language;
      document.documentElement.lang=language==="zh"?"zh-CN":"en";
      document.querySelectorAll("[data-i18n]").forEach(element=>element.textContent=t(element.dataset.i18n));
      document.querySelectorAll("[data-i18n-placeholder]").forEach(element=>element.placeholder=t(element.dataset.i18nPlaceholder));
      document.querySelectorAll("[data-i18n-aria]").forEach(element=>element.setAttribute("aria-label",t(element.dataset.i18nAria)));
      document.querySelectorAll("[data-i18n-title]").forEach(element=>element.title=t(element.dataset.i18nTitle));
      document.querySelector("#languageToggle").textContent=language==="zh"?"EN":"中";
      document.querySelector("#languageToggle").title=t("switchLanguage");
      const sidebarLabel=document.body.classList.contains("sidebar-collapsed")?t("expandSidebar"):t("collapseSidebar");
      document.querySelector("#sidebarToggle").title=sidebarLabel;
      document.querySelector("#sidebarToggle").setAttribute("aria-label",sidebarLabel);
      document.title=language==="zh"?"WebFile Explorer":"WebFile Explorer";
      render();
      if(selectedItem&&document.querySelector(".app").classList.contains("details-open")&&!matchMedia("(max-width: 768px)").matches)showDetails(selectedItem);
    }

    function setLanguage(nextLanguage,save=true){
      language=nextLanguage==="en"?"en":"zh";
      if(save)savePreference("webfile-language",language);
      applyLanguage();
    }

    function setTheme(theme,save=true){
      document.documentElement.dataset.theme=theme;
      document.querySelector("#theme").innerHTML=theme==="dark"
        ?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>'
        :'<svg viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"/></svg>';
      document.querySelector("#theme").title=t("switchTheme");
      document.querySelector('meta[name="theme-color"]').content=theme==="dark"?"#15140f":"#f7f6f1";
      if(save)savePreference("webfile-theme",theme);
    }

    function initializePreferences(){
      const savedLanguage=getPreference("webfile-language");
      language=savedLanguage==="zh"||savedLanguage==="en"?savedLanguage:(navigator.language.toLowerCase().startsWith("zh")?"zh":"en");
      const savedTheme=getPreference("webfile-theme");
      setTheme(savedTheme==="dark"||savedTheme==="light"?savedTheme:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),false);
      applyLanguage();
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change",event=>{
        if(!getPreference("webfile-theme"))setTheme(event.matches?"dark":"light",false);
      });
      window.addEventListener("languagechange",()=>{
        if(!getPreference("webfile-language"))setLanguage(navigator.language.toLowerCase().startsWith("zh")?"zh":"en",false);
      });
    }

    function dismissStartup(){
      const screen=document.querySelector("#startupScreen");
      window.setTimeout(()=>document.body.classList.remove("booting"),1020);
      window.setTimeout(()=>{
        screen.classList.add("leaving");
        screen.addEventListener("transitionend",event=>{
          if(event.target===screen)screen.remove();
        },{once:true});
        window.setTimeout(()=>screen.remove(),360);
      },620);
    }

    const iconPaths={
      folder:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/>',
      html:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 6.5h.01M11 6.5h.01M8 14l-2 2 2 2M16 14l2 2-2 2m-3-5-2 6"/>',
      document:'<path d="M6 3h8l4 4v14H6zM14 3v5h5M9 12h6M9 16h6"/>',
      image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 3-4 5 6"/>',
      video:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/>',
      audio:'<path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>',
      archive:'<path d="M4 7h16M5 7v13h14V7M3 4h18v3H3z"/><path d="M10 11h4m-2-4v8"/>',
      code:'<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-2-13-4 16"/>',
      other:'<path d="M6 3h8l4 4v14H6zM14 3v5h5M9 12h6"/>'
    };
    const knownIconTypes=new Set(Object.keys(iconPaths));
    function iconType(item){
      const type=item.type==="folder"?"folder":item.fileType||item.type||"other";
      return knownIconTypes.has(type)?type:"other";
    }
    function iconMarkup(type,wrapper="file-icon"){
      const safeType=knownIconTypes.has(type)?type:"other";
      return `<span class="${wrapper} file-icon-${safeType}" aria-hidden="true"><svg viewBox="0 0 24 24">${iconPaths[safeType]}</svg></span>`;
    }
    let currentFolder = root;
    const folderStack = [root];
    const expandedFolders = new Set();

    function flatten(folder,prefix=""){
      const result=[];
      (folder.children||[]).forEach(item=>{
        const pathKey=prefix?prefix+"/"+item.name:item.name;
        const entry={...item,pathKey,key:itemKey(item,pathKey)};
        result.push(entry);
        if(item.type==="folder")result.push(...flatten(item,pathKey));
      });
      return result;
    }

    function render(){
      const query = document.querySelector("#search").value.trim().toLowerCase();
      let visible=query
        ?flatten(root).filter(item=>item.name.toLowerCase().includes(query))
        :(currentFolder.children||[]).map(item=>{
          const pathKey=[...folderStack.slice(1).map(folder=>folder.name),item.name].join("/");
          return {...item,pathKey,key:itemKey(item,pathKey)};
        });
      const currentPath=folderStack.slice(1).map(folder=>folder.name).join("/");
      if(!query)visible=applyDisplayOrder(visible,currentPath);
      document.querySelector("#count").textContent = countLabel(visible.length);
      document.querySelector("#title").textContent=query?t("searchResults"):(currentFolder===root?t("allFiles"):currentFolder.name);
      renderBreadcrumb();
      renderFolderTree();
      document.querySelector("#files").innerHTML = visible.length ? visible.map(item => `
        <article class="card ${recentlyMovedPaths.has(item.key)?"just-moved":""}" data-key="${escapeHtml(item.key)}" draggable="${query?"false":"true"}" title="${t("dragToInsert")}" ${item.url ? 'data-url="'+escapeHtml(item.url)+'"' : ""}>
          <span class="drag-handle" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="5" cy="4" r="1"/><circle cx="11" cy="4" r="1"/><circle cx="5" cy="8" r="1"/><circle cx="11" cy="8" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="11" cy="12" r="1"/></svg></span>
          <div class="preview">${iconMarkup(iconType(item))}</div>
          <div class="card-info">
            ${iconMarkup(iconType(item),"file-dot")}
            <div class="card-text"><span class="card-name">${escapeHtml(item.name)}</span><span class="card-meta">${query?escapeHtml(item.pathKey):item.type==="folder"?countLabel((item.children||[]).length):fileMeta(item)}</span></div>
          </div>
        </article>`).join("") : `<div class="empty"><div><strong>${t("noResultsTitle")}</strong>${t("noResultsBody")}</div></div>`;
    }

    function readDisplayOrders(){
        try{
          const saved=JSON.parse(getPreference("webfile-display-orders")||"{}");
          return saved&&typeof saved==="object"&&!Array.isArray(saved)?saved:{};
        }catch{return {}}
    }

    function applyDisplayOrder(items,parentPath){
        const paths=readDisplayOrders()[parentPath];
        if(!Array.isArray(paths))return items;
        const rank=new Map(paths.map((path,index)=>[path,index]));
        return [...items].sort((a,b)=>(rank.get(a.key)??Number.MAX_SAFE_INTEGER)-(rank.get(b.key)??Number.MAX_SAFE_INTEGER));
    }

    function insertDisplayPosition(sourceKey,targetKey,after){
        if(!sourceKey||!targetKey||sourceKey===targetKey)return false;
        const parentPath=folderStack.slice(1).map(folder=>folder.name).join("/");
        const siblings=currentFolder.children||[];
        const keys=siblings.map(item=>itemKey(item,[...folderStack.slice(1).map(folder=>folder.name),item.name].join("/")));
        const sourceIndex=keys.indexOf(sourceKey);
        if(sourceIndex<0||!keys.includes(targetKey))return false;
        const originalOrder=[...keys];
        const [moving]=keys.splice(sourceIndex,1);
        const targetIndex=keys.indexOf(targetKey);
        keys.splice(targetIndex+(after?1:0),0,moving);
        if(keys.every((key,index)=>key===originalOrder[index]))return false;
        const orders=readDisplayOrders();
        orders[parentPath]=keys;
        savePreference("webfile-display-orders",JSON.stringify(orders));
        recentlyMovedPaths=new Set([sourceKey,targetKey]);
        ignoreCardClickUntil=Date.now()+350;
        render();
        window.setTimeout(()=>recentlyMovedPaths.clear(),600);
        return true;
    }

    function itemKey(item,pathKey){
        return item.type==="folder"?`folder:${pathKey}`:`file:${item.url||pathKey}`;
    }

    function findItemByKey(key){
        return flatten(root).find(item=>item.key===key);
    }

    function escapeHtml(value){
      return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    }

    function fileMeta(item){
      return `${t(item.fileType||item.type||"other")} · ${item.size||"—"}`;
    }

    function countLabel(count){
      return language==="en"?`${count} item${count===1?"":"s"}`:`${count} 个项目`;
    }

    function formatDate(value){
      if(!value)return "—";
      const date=new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime())?value:new Intl.DateTimeFormat(language==="zh"?"zh-CN":"en",{year:"numeric",month:"short",day:"numeric"}).format(date);
    }

    function renderFolderTree(){
      const tree=document.querySelector("#folderTree");
      tree.innerHTML=renderTreeItems(root.children||[]);
    }

    function renderTreeItems(items,prefix=""){
      const entries=applyDisplayOrder(items.map(item=>{
        const pathKey=prefix?prefix+"/"+item.name:item.name;
        return {item,pathKey,key:itemKey(item,pathKey)};
      }),prefix);
      return entries.map(({item,pathKey,key})=>{
        const isFolder=item.type==="folder";
        const hasChildren=isFolder&&(item.children||[]).length>0;
        const expanded=expandedFolders.has(pathKey);
        const selected=isFolder&&folderStack[folderStack.length-1]===item&&!document.querySelector("#search").value.trim();
        return `<div class="tree-node ${expanded?"expanded":""}" data-node-path="${escapeHtml(pathKey)}">
          <div class="tree-line ${selected?"selected":""}">
            ${hasChildren?`<button class="tree-expander" type="button" data-toggle-path="${escapeHtml(pathKey)}" aria-label="${expanded?t("collapse"):t("expand")} ${escapeHtml(item.name)}"><svg viewBox="0 0 16 16"><path d="m5 3 5 5-5 5"/></svg></button>`:'<span class="tree-expander spacer"></span>'}
            <button class="tree-folder" type="button" data-tree-path="${escapeHtml(pathKey)}" data-tree-key="${escapeHtml(key)}">
              ${iconMarkup(iconType(item),"tree-icon")}
              <span>${escapeHtml(item.name)}</span>
            </button>
          </div>
          ${hasChildren?`<div class="tree-children">${renderTreeItems(item.children,pathKey)}</div>`:""}
        </div>`;
      }).join("");
    }

    function renderBreadcrumb(){
      const breadcrumb=document.querySelector("#breadcrumb");
      breadcrumb.innerHTML=folderStack.map((folder,index)=>`
        ${index?'<span>›</span>':''}<button data-level="${index}">${index===0?t("allFiles"):escapeHtml(folder.name)}</button>
      `).join("");
    }

    function openFolder(folder,pathKey){
      currentFolder=folder;
      document.querySelector("#allFilesButton").classList.remove("active");
      const names=pathKey?pathKey.split("/").filter(Boolean):[];
      folderStack.splice(1);
      let node=root;
      names.forEach(name=>{
        node=(node.children||[]).find(child=>child.name===name);
        if(node)folderStack.push(node);
      });
      document.querySelector("#title").textContent=folder.name;
      render();
    }

    function showDetails(item){
      if(matchMedia("(max-width: 768px)").matches){
        if(item.url)window.open(new URL(item.url,location.href).href,"_blank","noopener");
        return;
      }
      selectedItem=item;
      document.querySelector(".app").classList.add("details-open");
      document.querySelector("#detailsBody").innerHTML=`
        <div class="details-preview">${iconMarkup(iconType(item))}</div>
        <p class="details-name">${escapeHtml(item.name)}</p>
        <div class="detail-tree">
          <section class="tree-group open">
            <button class="tree-toggle" type="button" aria-expanded="true">
              <span class="tree-arrow"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></span>
              <span>${t("basicInfo")}</span>
            </button>
            <div class="tree-content">
              <div class="tree-content-inner">
                <div class="tree-row"><span class="tree-row-label">${t("type")}</span><span class="tree-row-value">${t(item.type==="folder"?"folder":item.fileType||item.type||"other")}</span></div>
                <div class="tree-row"><span class="tree-row-label">${t("size")}</span><span class="tree-row-value">${item.size||"—"}</span></div>
                <div class="tree-row"><span class="tree-row-label">${t("modified")}</span><span class="tree-row-value">${formatDate(item.modified)}</span></div>
                ${item.url?`<div class="tree-row"><span class="tree-row-label">${t("location")}</span><span class="tree-row-value">${escapeHtml(item.url)}</span></div>`:""}
              </div>
            </div>
          </section>
          <section class="tree-group">
            <button class="tree-toggle" type="button" aria-expanded="false">
              <span class="tree-arrow"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></span>
              <span>${t("properties")}</span>
            </button>
            <div class="tree-content">
              <div class="tree-content-inner">
                <div class="tree-row"><span class="tree-row-label">${t("readOnly")}</span><span class="tree-row-value">${t("no")}</span></div>
                <div class="tree-row"><span class="tree-row-label">${t("hidden")}</span><span class="tree-row-value">${t("no")}</span></div>
              </div>
            </div>
          </section>
        </div>
      `;

      document.querySelectorAll("#detailsBody .tree-toggle").forEach(button=>{
        button.addEventListener("click",()=>{
          const group=button.closest(".tree-group");
          const open=group.classList.toggle("open");
          button.setAttribute("aria-expanded",open?"true":"false");
        });
      });
    }

    document.querySelector("#allFilesButton").addEventListener("click",()=>{
      currentFolder=root;
      folderStack.splice(1);
      document.querySelector("#search").value="";
      document.querySelector("#allFilesButton").classList.add("active");
      document.querySelector("#sidebar").classList.remove("open");
      document.querySelector("#sidebarScrim").classList.remove("open");
      render();
    });

    document.querySelector("#search").addEventListener("input",render);
    document.querySelector("#files").addEventListener("click",event=>{
      if(Date.now()<ignoreCardClickUntil)return;
      const card=event.target.closest(".card");
      if(!card)return;
      const item=findItemByKey(card.dataset.key);
      if(!item)return;
      if(item.type==="folder"){
        document.querySelector("#search").value="";
        openFolder(item,item.pathKey);
      }else{
        showDetails(item);
      }
    });
    document.querySelector("#files").addEventListener("dragstart",event=>{
      const card=event.target.closest('.card[draggable="true"]');
      if(!card||document.querySelector("#search").value.trim()){
        event.preventDefault();
        return;
      }
      draggingPath=card.dataset.key;
      dragInsertAfter=false;
      card.classList.add("dragging");
      event.dataTransfer.effectAllowed="move";
      event.dataTransfer.setData("text/plain",draggingPath);
    });
    document.querySelector("#files").addEventListener("dragover",event=>{
      const card=event.target.closest('.card[draggable="true"]');
      if(!draggingPath||!card||card.dataset.key===draggingPath)return;
      event.preventDefault();
      event.dataTransfer.dropEffect="move";
      const bounds=card.getBoundingClientRect();
      const listView=document.querySelector("#files").classList.contains("list");
      dragInsertAfter=listView
        ?event.clientY>bounds.top+bounds.height/2
        :event.clientX>bounds.left+bounds.width/2;
      document.querySelectorAll("#files .drop-target").forEach(element=>element.classList.remove("drop-target","drop-target-before","drop-target-after"));
      card.classList.add("drop-target",dragInsertAfter?"drop-target-after":"drop-target-before");
    });
    document.querySelector("#files").addEventListener("dragleave",event=>{
      const card=event.target.closest(".card");
      if(card&&!card.contains(event.relatedTarget))card.classList.remove("drop-target","drop-target-before","drop-target-after");
    });
    document.querySelector("#files").addEventListener("drop",event=>{
      const card=event.target.closest('.card[draggable="true"]');
      if(!card||!draggingPath)return;
      event.preventDefault();
      const sourcePath=draggingPath;
      draggingPath=null;
      insertDisplayPosition(sourcePath,card.dataset.key,dragInsertAfter);
    });
    document.querySelector("#files").addEventListener("dragend",event=>{
      const card=event.target.closest(".card");
      if(card)card.classList.remove("dragging","drop-target");
      draggingPath=null;
      dragInsertAfter=false;
      document.querySelectorAll("#files .dragging,#files .drop-target").forEach(element=>element.classList.remove("dragging","drop-target","drop-target-before","drop-target-after"));
      ignoreCardClickUntil=Date.now()+350;
    });
    document.querySelector("#files").addEventListener("dblclick",event=>{
      if(Date.now()<ignoreCardClickUntil)return;
      const card=event.target.closest("[data-url]");
      if(card&&!matchMedia("(max-width: 768px)").matches)window.open(card.dataset.url,"_blank");
    });
    document.querySelector("#breadcrumb").addEventListener("click",event=>{
      const button=event.target.closest("[data-level]");
      if(!button)return;
      const level=Number(button.dataset.level);
      while(folderStack.length>level+1)folderStack.pop();
      currentFolder=folderStack[folderStack.length-1];
      document.querySelector("#search").value="";
      document.querySelector("#title").textContent=currentFolder.name;
      render();
    });
    document.querySelector("#folderTree").addEventListener("click",event=>{
      const toggle=event.target.closest("[data-toggle-path]");
      if(toggle){
        const path=toggle.dataset.togglePath;
        if(expandedFolders.has(path))expandedFolders.delete(path);
        else expandedFolders.add(path);
        renderFolderTree();
        return;
      }
      const row=event.target.closest("[data-tree-path]");
      if(!row)return;
      const item=findItemByKey(row.dataset.treeKey);
      if(!item)return;
      document.querySelector("#search").value="";
      document.querySelector("#allFilesButton").classList.remove("active");
      if(item.type==="folder"){
        openFolder(item,item.pathKey);
      }else{
        showDetails(item);
      }
      document.querySelector("#sidebar").classList.remove("open");
      document.querySelector("#sidebarScrim").classList.remove("open");
    });
    document.querySelector("#closeDetails").addEventListener("click",()=>{
      document.querySelector(".app").classList.remove("details-open");
    });

    const resizer=document.querySelector("#detailsResizer");
    let resizing=false;
    resizer.addEventListener("pointerdown",event=>{
      resizing=true;
      resizer.classList.add("dragging");
      resizer.setPointerCapture(event.pointerId);
    });
    resizer.addEventListener("pointermove",event=>{
      if(!resizing)return;
      const width=Math.min(520,Math.max(240,innerWidth-event.clientX));
      document.documentElement.style.setProperty("--details-width",width+"px");
    });
    resizer.addEventListener("pointerup",()=>{
      resizing=false;
      resizer.classList.remove("dragging");
    });
    document.querySelectorAll("[data-view]").forEach(button=>{
      button.addEventListener("click",()=>{
        document.querySelectorAll("[data-view]").forEach(el=>el.classList.remove("active"));
        button.classList.add("active");
        document.querySelector("#files").className=button.dataset.view;
      });
    });
    document.querySelector("#mobileMenu").addEventListener("click",()=>{
      document.body.classList.remove("sidebar-collapsed");
      const open=document.querySelector("#sidebar").classList.toggle("open");
      document.querySelector("#sidebarScrim").classList.toggle("open",open);
    });
    document.querySelector("#sidebarScrim").addEventListener("click",()=>{
      document.querySelector("#sidebar").classList.remove("open");
      document.querySelector("#sidebarScrim").classList.remove("open");
    });
    document.querySelector("#sidebarToggle").addEventListener("click",()=>{
      if(matchMedia("(max-width: 768px)").matches){
        document.body.classList.remove("sidebar-collapsed");
        document.querySelector("#sidebar").classList.remove("open");
        document.querySelector("#sidebarScrim").classList.remove("open");
      }else{
      document.body.classList.toggle("sidebar-collapsed");
      const label=document.body.classList.contains("sidebar-collapsed")?t("expandSidebar"):t("collapseSidebar");
      document.querySelector("#sidebarToggle").title=label;
      document.querySelector("#sidebarToggle").setAttribute("aria-label",label);
      }
    });

    document.querySelector("#languageToggle").addEventListener("click",()=>setLanguage(language==="zh"?"en":"zh"));
    document.querySelector("#theme").addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));
    initializePreferences();
    dismissStartup();
  </script>
</body>
</html>
